[package]
name = "sortwise"
version = "0.1.0"
edition = "2021"

[lib]
name = "sortwise"
path = "src/lib.rs"

[[bin]]
name = "sortwise"
path = "src/main.rs"

[[bin]]
name = "sortwise-cli"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = []
cli = []
similarity = []
cdc = []
# Embedded libmpv-based video player (requires system libmpv: `brew install mpv`).
mpv = ["dep:libmpv2"]

[dependencies]
eframe = { version = "0.29", features = ["glow"] }
egui = "0.29"
egui-phosphor = "0.7"
blake3 = "1.5"
rayon = "1.10"
crossbeam-channel = "0.5"
walkdir = "2.5"
ignore = "0.4"          # parallel recursive directory walker
bincode = "1.3"         # legacy hash cache format (read-only migration)
rusqlite = { version = "0.32", features = ["bundled"] }  # hash cache store (WAL, incremental upserts)
anyhow = "1.0"
num_cpus = "1.16"
memmap2 = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
trash = "5"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
exif = { package = "kamadak-exif", version = "0.5" }  # embedded thumbnails and orientation (P-4)
libc = "0.2"
libmpv2 = { version = "4", optional = true }

[dev-dependencies]
criterion = "0.5"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "handleapi", "ioapiset", "winbase", "winioctl", "winnt"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[[bench]]
name = "hash_bench"
harness = false
