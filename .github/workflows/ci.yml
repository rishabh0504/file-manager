name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build library and GUI
        run: cargo build --all-targets
      - name: Tests
        run: cargo test
      - name: CLI (feature)
        run: cargo build --features cli --bin sortwise-cli
